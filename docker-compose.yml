version: '3.8'

services:
  web:
    build: .
    container_name: personal-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - FLASK_AUTO_RELOAD=false
      - HTTPS_ONLY=true
      - PORT=5000
      # Database - Supabase PostgreSQL
      - DATABASE_URL=${DATABASE_URL}
      # Email - Brevo SMTP/API
      - MAIL_API_KEY=${MAIL_API_KEY}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - MAIL_SERVER=smtp-relay.brevo.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=True
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # PayPal Configuration
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      # Company Information
      - COMPANY_NAME=EmmaStudio
      - COMPANY_ADDRESS=Professional Freelancing Services
      - COMPANY_CITY=${COMPANY_CITY}
      - COMPANY_COUNTRY=${COMPANY_COUNTRY}
      - COMPANY_PHONE=${COMPANY_PHONE}
      - COMPANY_EMAIL=${COMPANY_EMAIL}
      # Payment Configuration
      - PAYMENT_METHODS=PayPal, Bank Transfer
      - LATE_FEE=5% per month on overdue amount
      - EARLY_DISCOUNT=2% discount if paid within 10 days
      - INVOICE_PREFIX=INV-
      - INVOICE_DUE_DAYS=30
      - INVOICE_REMINDER_SCHEDULE=7,1,-1,-7
      # Application Settings
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - APP_BASE_URL=${APP_BASE_URL}
      - SCHEDULER_ENABLED=true
      - NOTIFICATION_CLEANUP_DAYS=90
      - DEADLINE_REMINDER_SCHEDULE=7,3,1,-1
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./pdf_cache:/app/pdf_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
