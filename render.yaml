services:
  - type: web
    name: personal-app
    env: python
    plan: free
    pythonVersion: 3.11.4
    
    # Build command - run build script
    buildCommand: bash build.sh
    
    # Start command - run start script
    startCommand: bash start.sh
    
    # Environment variables
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_AUTO_RELOAD
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: personal-app-db
          property: connectionString
      - key: PORT
        value: "8000"
      - key: WORKERS
        value: "2"
      - key: TIMEOUT
        value: "120"
      - key: MAX_REQUESTS
        value: "1000"
      - key: MAX_REQUESTS_JITTER
        value: "100"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: COMPANY_NAME
        value: EmmaStudio
      - key: COMPANY_ADDRESS
        value: Professional Freelancing Services
      - key: COMPANY_CITY
        sync: false
      - key: COMPANY_COUNTRY
        sync: false
      - key: COMPANY_PHONE
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: PAYMENT_METHODS
        value: "PayPal, Bank Transfer"
      - key: LATE_FEE
        value: "5% per month on overdue amount"
      - key: EARLY_DISCOUNT
        value: "2% discount if paid within 10 days"
      - key: INVOICE_PREFIX
        value: INV-
      - key: INVOICE_DUE_DAYS
        value: "30"
      - key: INVOICE_REMINDER_SCHEDULE
        value: "7,1,-1,-7"
    
    # Health check - use API test endpoint instead of login
    healthCheckPath: /api/test
    
    # Auto-scaling configuration
    numInstances: 1
    
    # Disk configuration for file uploads
    disk:
      name: uploads
      mountPath: /opt/render/project/uploads
      sizeGB: 1

databases:
  - name: personal-app-db
    plan: free
    databaseName: personalapp
    user: personalapp
