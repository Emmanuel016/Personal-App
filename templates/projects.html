{% extends "base.html" %}
{% block content %}

<style>
/* Modern Design System */
:root {
    --primary-cyan: #00f2fe;
    --secondary-cyan: #4facfe;
    --danger-red: #ff003c;
    --warning-amber: #ff9100;
    --success-green: #00e676;
    --bg-dark: #0a192f;
    --bg-card: rgba(10, 25, 47, 0.8);
    --text-primary: #ffffff;
    --text-secondary: #8892b0;
    --border-color: rgba(255, 255, 255, 0.1);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

/* Base Layout */
.projects-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
}

.projects-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid var(--border-color);
}

.projects-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--primary-cyan);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 1rem;
}

.projects-title i {
    font-size: 2rem;
}

.projects-stats {
    display: flex;
    gap: 1rem;
    align-items: center;
}

.stat-badge {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 0.5rem 1rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
    backdrop-filter: blur(10px);
}

/* Dashboard Grid */
.projects-dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-bottom: 2rem;
}

@media (max-width: 1024px) {
    .projects-dashboard {
        grid-template-columns: 1fr;
    }
}

/* Card Components */
.dashboard-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.5rem;
    backdrop-filter: blur(16px);
    transition: all 0.3s ease;
}

.dashboard-card:hover {
    border-color: var(--primary-cyan);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
}

.card-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--text-primary);
}

.card-header i {
    color: var(--primary-cyan);
    font-size: 1.25rem;
}

/* Form Elements */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.form-input, .form-select, .form-textarea {
    background: var(--bg-dark);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 0.75rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.875rem;
    color: var(--text-primary);
    transition: all 0.3s ease;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--primary-cyan);
    box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.1);
}

.form-input::placeholder, .form-select::placeholder, .form-textarea::placeholder {
    color: rgba(255, 255, 255, 0.5);
    font-family: 'Rajdhani', sans-serif;
}

.form-input:focus::placeholder, .form-select:focus::placeholder, .form-textarea:focus::placeholder {
    color: rgba(255, 255, 255, 0.3);
}

.form-textarea {
    min-height: 100px;
    resize: vertical;
}

.form-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1rem;
}

/* Buttons */
.btn {
    background: linear-gradient(135deg, var(--primary-cyan), var(--secondary-cyan));
    border: none;
    border-radius: 8px;
    padding: 0.75rem 1.5rem;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--bg-dark);
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
}

.btn:active {
    transform: translateY(0);
}

.btn-secondary {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
}

.btn-secondary:hover {
    border-color: var(--primary-cyan);
    color: var(--primary-cyan);
}

/* Projects List */
.projects-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

/* Chart Container */
.chart-container {
    background: var(--bg-dark);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1rem;
    height: 300px;
    position: relative;
}

/* Responsive Design */
@media (max-width: 1024px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    
    .form-row {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 768px) {
    .projects-container {
        padding: 1rem;
    }
    
    .projects-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }
    
    .projects-title {
        font-size: 2rem;
    }
    
    .projects-stats {
        flex-wrap: wrap;
    }
}

@media (max-width: 480px) {
    .projects-container {
        padding: 0.5rem;
    }
    
    .projects-title {
        font-size: 1.5rem;
    }
    
    .dashboard-card {
        padding: 1rem;
    }
}
</style>

<div class="projects-container">
    <!-- Header -->
    <div class="projects-header">
        <h1 class="projects-title">
            <i class="fa-solid fa-building"></i>
            Project Command Center
        </h1>
        <div class="projects-stats">
            <div class="stat-badge">
                <i class="fa-solid fa-folder-open"></i>
                <span id="projectCount">0</span> Projects
            </div>
            <div class="stat-badge">
                <i class="fa-solid fa-clock"></i>
                <span id="activeCount">0</span> Active
            </div>
            <div class="stat-badge">
                <i class="fa-solid fa-check-circle"></i>
                <span id="completedCount">0</span> Completed
            </div>
            <div class="stat-badge">
                <i class="fa-solid fa-exclamation-triangle"></i>
                <span id="pendingCount">0</span> Pending
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="projects-dashboard">
        <!-- Add New Project -->
        <div class="dashboard-card">
            <div class="card-header">
                <i class="fa-solid fa-plus-circle"></i>
                Initialize New Project
            </div>

            <form id="addProjectForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Client ID</label>
                        <input type="number" id="clientId" class="form-input" placeholder="Enter client ID" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Project Value (£)</label>
                        <input type="number" id="projectPrice" class="form-input" placeholder="0.00" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Project Title</label>
                    <input type="text" id="projectTitle" class="form-input" placeholder="Enter project name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="projectDescription" class="form-textarea" placeholder="Project scope and deliverables" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select id="projectStatus" class="form-select">
                            <option value="Pending">Pending</option>
                            <option value="Active" selected>Active</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Deadline</label>
                        <input type="date" id="projectDeadline" class="form-input">
                    </div>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fa-solid fa-building"></i>
                    Initialize Project
                </button>
            </form>
        </div>

        <!-- Analytics -->
        <div class="dashboard-card">
            <div class="card-header">
                <i class="fa-solid fa-chart-line"></i>
                Project Analytics
            </div>
            
            <div class="chart-container">
                <canvas id="projectChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Projects List -->
    <div class="dashboard-card">
        <div class="card-header">
            <i class="fa-solid fa-list-check"></i>
            Active Projects Registry
        </div>
        
        <div id="projectsList" class="projects-list"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% endblock %}
