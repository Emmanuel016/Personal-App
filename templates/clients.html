{% extends "base.html" %}
{% block content %}

<style>
/* Layout */
.flex-wrap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}

/* Cards */
.card {
    background: rgba(15, 23, 42, 0.6);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.card:hover {
    transform: translateY(-2px);
    border-color: rgba(6, 182, 212, 0.2);
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
}

/* Inputs */
input, textarea {
    width: 100%;
    padding: 5px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    outline: none;
    background: rgba(15, 23, 42, 0.8);
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    transition: all 0.3s ease;
}

input:focus, textarea:focus {
    border-color: #06b6d4;
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
}

input::placeholder, textarea::placeholder {
    color: rgba(255, 255, 255, 0.5);
    font-family: 'JetBrains Mono', monospace;
}

input:focus::placeholder, textarea:focus::placeholder {
    color: rgba(255, 255, 255, 0.3);
}

/* Button */
button.primary-btn {
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
}

button.primary-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
}

/* Client list */
#clientList {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 400px;
    overflow-y: auto;
}

#clientList li {
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.02);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#clientList li:hover {
    background: rgba(6, 182, 212, 0.08);
    border-color: rgba(6, 182, 212, 0.2);
    transform: translateX(3px);
}

/* Chat messages frame with fluid height for laptops */
.messages {
    height: 450px;
    max-height: calc(100vh - 300px);
    min-height: 250px;
    overflow-y: auto;
    padding: 15px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
}

/* Warning Message */
.warning-message {
    background: rgba(255, 152, 0, 0.1);
    border: 1px solid rgba(255, 152, 0, 0.3);
    color: #fbbf24;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    display: none;
    font-size: 13px;
}

/* Responsive Overrides */
@media (max-width: 768px) {
    .flex-wrap {
        grid-template-columns: 1fr;
    }
}
</style>

<h2 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; font-size: 1.8rem; margin-bottom: 20px; font-weight: 700; color: #f8fafc;">CLIENT DIRECTORY</h2>

<div class="flex-wrap">

    <!-- Add Client Form -->
    <div class="card">
        <h3 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px;">Add Client</h3>
        <input id="c_name" placeholder="Full Name">
        <input id="c_email" placeholder="Email">
        <input id="c_company" placeholder="Company">
        <input id="c_phone" placeholder="Phone">
        <textarea id="c_notes" placeholder="Notes" rows="3"></textarea>
        <button class="primary-btn" onclick="addClient()">Add Client</button>
    </div>

    <!-- Client List -->
    <div class="card">
        <h3 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px;">Active Clients</h3>
        <ul id="clientList" class="cyber-scroll">
            <li style="cursor: default; opacity: 0.5;">Loading clients...</li>
        </ul>
    </div>

</div>

<!-- Messages Panel -->
<div class="card" id="messagePanel" style="display:none; margin-top: 20px; position: relative;">

    <h3 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px;">
        COMMUNICATIONS WITH <span id="msgClientName" style="color: #06b6d4;"></span>
    </h3>
    <div id="messageList" class="messages cyber-scroll"></div>

    <div class="message-input-wrapper" style="display: flex; flex-direction: column; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-top: 12px; padding: 10px;">
        
        <!-- File Preview UI Block -->
        <div id="adminFilePreviewContainer" style="display: none; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 8px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 8px; color: #06b6d4; font-size: 12px; width: fit-content; max-width: 100%;">
            <i class="fa-solid fa-file-arrow-up"></i>
            <span id="adminPreviewFilename" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;"></span>
            <button onclick="removeAdminSelectedFile()" style="background: none; border: none; color: #ef4444; cursor: pointer; margin-left: 10px; font-size: 14px; transition: 0.2s;" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='#ef4444'">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <!-- Standard Messaging Input Bar -->
        <div class="message-input" style="display: flex; gap: 10px; align-items: center; width: 100%;">
            <input id="fileInput" type="file" style="display: none;">
            
            <button id="fileUploadBtn" onclick="document.getElementById('fileInput').click()" style="width: 42px; height: 42px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #94a3b8; transition: all 0.2s ease; flex-shrink: 0;" title="Attach File" onmouseover="this.style.borderColor='#06b6d4'; this.style.color='#06b6d4'; this.style.background='rgba(6, 182, 212, 0.05)';" onmouseout="this.style.borderColor='rgba(255,255,255,0.08)'; this.style.color='#94a3b8'; this.style.background='rgba(255,255,255,0.03)';">
                <i class="fa-solid fa-plus"></i>
            </button>

            <input id="msgContent" placeholder="Type a message..." style="margin: 0; flex: 1;" onkeypress="if(event.key==='Enter') sendMessage()">
            
            <button class="primary-btn" onclick="sendMessage()" style="width: 50px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <i class="fa-solid fa-paper-plane" style="font-size: 12px;"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // All real-time chat and client directory operational logic 
    // is now securely governed globally by app.js
</script>

{% endblock %}
