{% extends "base.html" %}
{% block content %}
<style>
.testimonials-admin { max-width: 1200px; margin: 0 auto; padding: 20px; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.admin-title { font-family: 'Rajdhani', sans-serif; font-size: 30px; font-weight: 700; color: #00f2fe; letter-spacing: 2px; margin: 0; }
.btn-primary { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #0a192f; border: none; padding: 10px 22px; border-radius: 10px; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.btn-primary:disabled { opacity: 0.6; cursor: wait; }
.btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #cbd5e1; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.btn-danger { background: rgba(255,0,60,0.2); border: 1px solid rgba(255,0,60,0.4); color: #ff8fab; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.card { background: rgba(10,25,47,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 22px; margin-bottom: 20px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; font-weight: 700; }
.field input, .field textarea, .field select { background: rgba(0,0,0,0.4); border: 1px solid rgba(0,242,254,0.18); border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 14px; }
.field textarea { min-height: 90px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: #00f2fe; }
.rating-input { display: flex; gap: 8px; align-items: center; }
.rating-input button { background: rgba(0,242,254,0.1); border: 1px solid rgba(0,242,254,0.3); color: #00f2fe; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.rating-input button:hover { background: rgba(0,242,254,0.2); }
.rating-input button.active { background: #00f2fe; color: #0a192f; }
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.item-card { background: rgba(10,25,47,0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; }
.item-title { color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; margin: 0 0 8px; }
.item-meta { font-size: 12px; color: #64748b; margin-bottom: 12px; }
.item-quote { color: #94a3b8; font-size: 13px; font-style: italic; margin-bottom: 12px; line-height: 1.5; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.badge.published { background: rgba(0,242,254,0.15); color: #00f2fe; }
.badge.draft { background: rgba(255,0,60,0.15); color: #ff8fab; }
.actions { display: flex; gap: 8px; margin-top: 12px; }
</style>

<div class="testimonials-admin">
    <div class="admin-header">
        <h1 class="admin-title">Testimonials Manager</h1>
    </div>

    <div class="card">
        <h3 style="color:#fff;font-family:'Rajdhani';letter-spacing:1px;margin:0 0 16px;" id="editorTitle">Add Testimonial</h3>
        <form id="testimonialForm">
            <input type="hidden" id="editId">
            <div class="form-grid">
                <div class="field"><label>Client Name *</label><input name="client_name" id="fClientName" required placeholder="Name to display publicly"></div>
                <div class="field"><label>Project/Service *</label><input name="project_service" id="fProject" required placeholder="e.g. UI/UX Design, Web App"></div>
                <div class="field"><label>Testimonial Date *</label><input name="testimonial_date" id="fDate" type="date" required></div>
                <div class="field"><label>Rating (1-5)</label>
                    <div class="rating-input" id="ratingInput">
                        <button type="button" data-rating="1">★</button>
                        <button type="button" data-rating="2">★</button>
                        <button type="button" data-rating="3">★</button>
                        <button type="button" data-rating="4">★</button>
                        <button type="button" data-rating="5">★</button>
                        <input type="hidden" name="rating" id="fRating" value="">
                    </div>
                </div>
                <div class="field"><label>Sort Order</label><input name="sort_order" id="fSort" type="number" value="0"></div>
                <div class="field"><label>Published</label>
                    <select name="is_published" id="fPublished">
                        <option value="1" selected>Published</option>
                        <option value="0">Draft / Hidden</option>
                    </select>
                </div>
            </div>
            <div class="field" style="margin-bottom: 16px;">
                <label>Testimonial Text (optional)</label>
                <textarea name="testimonial_text" id="fText" placeholder="Client's review or feedback..."></textarea>
            </div>
            <div style="display:flex;gap:10px;margin-top:18px;">
                <button type="submit" class="btn-primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Save Testimonial</button>
                <button type="button" class="btn-ghost" onclick="resetForm()">Cancel</button>
            </div>
            <div id="statusMsg"></div>
        </form>
    </div>

    <h3 style="color:#fff;font-family:'Rajdhani';letter-spacing:1px;">Testimonials (<span id="itemCount">0</span>)</h3>
    <div class="item-grid" id="itemGrid"></div>
</div>

<script>
let items = [];

async function loadItems() {
    try {
        const res = await fetch('/api/admin/testimonials');
        items = await res.json();
        document.getElementById('itemCount').textContent = items.length;
        renderItems();
    } catch (e) { console.error(e); }
}

function renderItems() {
    const grid = document.getElementById('itemGrid');
    if (!items.length) { grid.innerHTML = '<p style="color:#64748b;">No testimonials yet — add the first one above.</p>'; return; }
    grid.innerHTML = items.map(t => `
        <div class="item-card">
            <h4 class="item-title">${escapeHtml(t.client_name)}</h4>
            <div class="item-meta">
                ${escapeHtml(t.project_service)} · ${t.testimonial_date ? new Date(t.testimonial_date).toLocaleDateString('en-GB') : ''}
                ${t.rating ? ' · ' + '★'.repeat(t.rating) : ''}
            </div>
            <p class="item-quote">${escapeHtml(t.testimonial_text || 'No text provided')}</p>
            <span class="badge ${t.is_published ? 'published' : 'draft'}">${t.is_published ? 'Published' : 'Draft'}</span>
            <div class="actions">
                <button class="btn-ghost" onclick="editItem(${t.id})">Edit</button>
                <button class="btn-danger" onclick="deleteItem(${t.id}, '${escapeHtml(t.client_name)}')">Delete</button>
            </div>
        </div>`).join('');
}

function editItem(id) {
    const t = items.find(x => x.id == id);
    if (!t) return;
    document.getElementById('editId').value = t.id;
    document.getElementById('editorTitle').textContent = 'Edit Testimonial';
    document.getElementById('fClientName').value = t.client_name || '';
    document.getElementById('fProject').value = t.project_service || '';
    document.getElementById('fDate').value = t.testimonial_date || '';
    document.getElementById('fText').value = t.testimonial_text || '';
    document.getElementById('fRating').value = t.rating || '';
    document.getElementById('fSort').value = t.sort_order || 0;
    document.getElementById('fPublished').value = t.is_published ? '1' : '0';
    updateRatingUI(t.rating);
    document.getElementById('editorCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetForm() {
    document.getElementById('testimonialForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('editorTitle').textContent = 'Add Testimonial';
    document.getElementById('fRating').value = '';
    updateRatingUI(null);
}

document.getElementById('testimonialForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    const msg = document.getElementById('statusMsg');
    btn.disabled = true; msg.textContent = '';
    const id = document.getElementById('editId').value;
    const url = id ? `/api/admin/testimonials/${id}` : '/api/admin/testimonials';
    const fd = new FormData(e.target);
    try {
        const res = await fetch(url, { method: 'POST', body: fd });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.status === 'success') {
            msg.style.color = '#00e676';
            msg.textContent = 'Testimonial saved.';
            resetForm();
            loadItems();
        } else {
            msg.style.color = '#ff8fab';
            msg.textContent = data.error || 'Save failed.';
        }
    } catch (err) {
        msg.style.color = '#ff8fab';
        msg.textContent = 'Save failed: ' + err.message;
    } finally { btn.disabled = false; }
});

async function deleteItem(id, name) {
    if (!confirm(`Delete testimonial from "${name}"?`)) return;
    const res = await fetch(`/api/admin/testimonials/${id}`, { method: 'DELETE' });
    if (res.ok) loadItems();
    else alert('Delete failed.');
}

function escapeHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// Rating input UI
document.querySelectorAll('#ratingInput button').forEach(btn => {
    btn.addEventListener('click', () => {
        const rating = btn.dataset.rating;
        document.getElementById('fRating').value = rating;
        updateRatingUI(parseInt(rating));
    });
});

function updateRatingUI(rating) {
    document.querySelectorAll('#ratingInput button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.rating <= rating);
    });
}

document.addEventListener('DOMContentLoaded', () => { loadItems(); });
</script>
{% endblock %}
