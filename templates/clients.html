{% extends "base.html" %}
{% block content %}

<style>
/* Layout */
.flex-wrap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}

/* Cards */
.card {
    background: rgba(15, 23, 42, 0.6);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.card:hover {
    transform: translateY(-2px);
    border-color: rgba(6, 182, 212, 0.2);
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
}

/* Inputs */
input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    outline: none;
    background: rgba(15, 23, 42, 0.8);
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    transition: all 0.3s ease;
}

input:focus, textarea:focus {
    border-color: #06b6d4;
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
}

/* Button */
button {
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
}

button:hover {
    transform: scale(1.02);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
}

/* Client list */
#clientList {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 400px;
    overflow-y: auto;
}

#clientList li {
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.02);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#clientList li:hover {
    background: rgba(6, 182, 212, 0.08);
    border-color: rgba(6, 182, 212, 0.2);
    transform: translateX(3px);
}

.client-info span {
    display: block;
    font-size: 0.8em;
    color: #94a3b8;
    margin-top: 2px;
}

/* Chat messages frame with fluid height for laptops */
.messages {
    height: 380px;
    max-height: calc(100vh - 350px);
    min-height: 250px;
    overflow-y: auto;
    padding: 12px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
}

/* Message bubbles */
.message {
    padding: 10px 14px;
    margin: 6px 0;
    border-radius: 12px;
    max-width: 80%;
    font-size: 13px;
    line-height: 1.4;
    animation: fadeIn 0.2s ease-out;
}

.message.sent {
    background: #0891b2;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
}

.message.received {
    background: rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
    border: 1px solid rgba(255, 255, 255, 0.03);
}

/* Input area */
.message-input {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    align-items: center;
}

.message-input input {
    flex: 1;
    margin: 0;
}

/* Animations */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(6px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Warning Message */
.warning-message {
    background: rgba(255, 152, 0, 0.1);
    border: 1px solid rgba(255, 152, 0, 0.3);
    color: #fbbf24;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    display: none;
    font-size: 13px;
}

.warning-message i {
    margin-right: 0.5rem;
}

/* Responsive Overrides */
@media (max-width: 768px) {
    .flex-wrap {
        grid-template-columns: 1fr;
    }
}
</style>

<h2 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; font-size: 1.8rem; margin-bottom: 20px; font-weight: 700; color: #f8fafc;">CLIENT DIRECTORY</h2>

<div class="flex-wrap">

    <!-- Add Client Form -->
    <div class="card">
        <div class="warning-message" id="warningMessage">
            <i class="fa-solid fa-exclamation-triangle"></i>
            <span id="warningText"></span>
        </div>
        <h3 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px;">Add Client</h3>
        <input id="c_name" placeholder="Full Name">
        <input id="c_email" placeholder="Email">
        <input id="c_company" placeholder="Company">
        <input id="c_phone" placeholder="Phone">
        <textarea id="c_notes" placeholder="Notes" rows="3"></textarea>
        <button onclick="addClient()">Add Client</button>
    </div>

    <!-- Client List -->
    <div class="card">
        <h3 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px;">Active Clients</h3>
        <ul id="clientList" class="cyber-scroll">
            <li style="cursor: default; opacity: 0.5;">Loading clients...</li>
        </ul>
    </div>

</div>

<!-- Messages Panel -->
<div class="card" id="messagePanel" style="display:none; margin-top: 20px;">
    <div class="warning-message" id="chatWarningMessage">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="chatWarningText"></span>
    </div>

    <h3 style="font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px;">
        COMMUNICATIONS WITH <span id="msgClientName" style="color: #06b6d4;"></span>
    </h3>
    <div id="messageList" class="messages cyber-scroll"></div>
    <div class="message-input">
        <input id="fileInput" type="file" style="display: none;">
        
        <!-- Clean, modern circular plus sign file uploader -->
        <button id="fileUploadBtn" style="width: 42px; height: 42px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #94a3b8; transition: all 0.2s ease; flex-shrink: 0;" title="Upload File" onmouseover="this.style.borderColor='#06b6d4'; this.style.color='#06b6d4'; this.style.background='rgba(6, 182, 212, 0.05)';" onmouseout="this.style.borderColor='rgba(255,255,255,0.08)'; this.style.color='#94a3b8'; this.style.background='rgba(255,255,255,0.03)';">
            <i class="fa-solid fa-plus"></i>
        </button>

        <input id="msgContent" placeholder="Type a message..." style="margin: 0;" onkeypress="if(event.key==='Enter') sendMessage()">
        
        <button onclick="sendMessage()" style="width: 50px; height: 42px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <i class="fa-solid fa-paper-plane" style="font-size: 12px;"></i>
        </button>
    </div>
</div>

<script>
let currentSelectedClient = null;

async function loadClients() {
    const listElement = document.getElementById("clientList");
    
    try {
        const response = await fetch("/api/clients"); 
        
        // Handle authentication errors
        if (response.status === 401 || response.status === 403) {
            console.error("Authentication required for /api/clients");
            return;
        }
        
        if (!response.ok) {
            console.error(`API error: ${response.status} ${response.statusText}`);
            return;
        }
        
        const data = await response.json();

        listElement.innerHTML = "";

        if (!data || data.length === 0) {
            listElement.innerHTML = "<li>No clients found.</li>";
            return;
        }

        data.forEach(client => {
            const li = document.createElement("li");
            li.innerHTML = `
                <div class="client-info">
                    <strong>${client.username || client.fullName}</strong>
                    <span>${client.company || 'No Company'}</span>
                </div>
                <small style="color: #06b6d4; font-weight: bold; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; uppercase">View</small>
            `;
            li.onclick = () => selectClient(client);
            listElement.appendChild(li);
        });
    } catch (err) {
        console.error("Failed to load clients:", err);
    }
}

function selectClient(client) {
    currentSelectedClient = client;
    document.getElementById("messagePanel").style.display = "block";
    document.getElementById("msgClientName").innerText = (client.username || client.fullName).toUpperCase();

    loadMessages(client.id);

    document.getElementById("messagePanel").scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function sendMessage() {
    const input = document.getElementById("msgContent");
    if (!input.value.trim()) return;

    const content = input.value.trim();
    input.value = "";

    try {
        const response = await fetch(`/api/messages/${currentSelectedClient.id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                content: content,
                sender: "admin"
            })
        });

        // Handle authentication errors
        if (response.status === 401 || response.status === 403) {
            console.error("Authentication required for sending message");
            return;
        }

        if (response.ok) {
            loadMessages(currentSelectedClient.id);
        }
    } catch (err) {
        console.error("Failed to send message:", err);
    }
}

async function loadMessages(clientId) {
    const msgList = document.getElementById("messageList");

    try {
        const response = await fetch(`/api/messages/${clientId}`);
        
        // Handle authentication errors
        if (response.status === 401 || response.status === 403) {
            console.error("Authentication required for /api/messages");
            return;
        }
        
        if (!response.ok) {
            console.error(`API error: ${response.status} ${response.statusText}`);
            return;
        }
        
        const messages = await response.json();

        const filesResponse = await fetch(`/api/messages/${clientId}/files`);
        
        // Handle authentication errors for files
        if (filesResponse.status === 401 || filesResponse.status === 403) {
            console.error("Authentication required for /api/messages/files");
            return;
        }
        
        const filesData = await filesResponse.json();
        const filesMap = {};
        if (filesData && filesData.files) {
            filesData.files.forEach(f => {
                if (!filesMap[f.message_id]) filesMap[f.message_id] = [];
                filesMap[f.message_id].push(f);
            });
        }

        msgList.innerHTML = "";

        if (Array.isArray(messages)) {
            messages.forEach(msg => {
                const msgDiv = document.createElement("div");
                msgDiv.className = `message ${msg.from_role === 'admin' ? 'sent' : 'received'}`;

                const contentDiv = document.createElement("div");
                contentDiv.textContent = msg.content;
                msgDiv.appendChild(contentDiv);

                if (filesMap[msg.id] && filesMap[msg.id].length > 0) {
                    const filesDiv = document.createElement("div");
                    filesDiv.style.marginTop = "8px";
                    filesDiv.style.display = "flex";
                    filesDiv.style.flexWrap = "wrap";
                    filesDiv.style.gap = "6px";

                    filesMap[msg.id].forEach(f => {
                        const fileSizeKb = (f.file_size / 1024).toFixed(1);
                        const fileLink = document.createElement("a");
                        fileLink.href = `/api/files/${f.id}/download`;
                        fileLink.style.padding = "4px 8px";
                        fileLink.style.background = "rgba(6, 182, 212, 0.15)";
                        fileLink.style.border = "1px solid rgba(6, 182, 212, 0.3)";
                        fileLink.style.borderRadius = "4px";
                        fileLink.style.color = "#22d3ee";
                        fileLink.style.textDecoration = "none";
                        fileLink.style.fontSize = "11px";
                        fileLink.style.display = "flex";
                        fileLink.style.alignItems = "center";
                        fileLink.style.gap = "4px";
                        fileLink.innerHTML = `<i class="fa-solid fa-paperclip"></i> ${f.original_filename} (${fileSizeKb}KB)`;
                        filesDiv.appendChild(fileLink);
                    });

                    msgDiv.appendChild(filesDiv);
                }

                msgList.appendChild(msgDiv);
            });

            msgList.scrollTop = msgList.scrollHeight;
        }
    } catch (err) {
        console.error("Failed to load messages:", err);
    }
}

async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        showChatWarning('Please select a file');
        return;
    }

    const file = fileInput.files[0];

    if (file.size > 100 * 1024 * 1024) {
        showChatWarning('File too large (max 100MB)');
        fileInput.value = '';
        return;
    }

    const fileNotifyMsg = `📎 File: ${file.name}`;

    try {
        const msgResponse = await fetch(`/api/messages/${currentSelectedClient.id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                content: fileNotifyMsg,
                sender: "admin"
            })
        });

        // Handle authentication errors
        if (msgResponse.status === 401 || msgResponse.status === 403) {
            console.error("Authentication required for message creation");
            return;
        }

        if (!msgResponse.ok) {
            showChatWarning('Failed to create message for file');
            return;
        }

        const messagesResponse = await fetch(`/api/messages/${currentSelectedClient.id}`);
        
        // Handle authentication errors
        if (messagesResponse.status === 401 || messagesResponse.status === 403) {
            console.error("Authentication required for messages");
            return;
        }
        
        const messages = await messagesResponse.json();

        if (!Array.isArray(messages) || messages.length === 0) {
            showChatWarning('Failed to get message for file attachment');
            return;
        }

        const latestMsg = messages[messages.length - 1];
        const messageId = latestMsg.id;

        const formData = new FormData();
        formData.append('file', file);

        const uploadResponse = await fetch(`/api/messages/${messageId}/upload`, {
            method: 'POST',
            body: formData
        });

        // Handle authentication errors
        if (uploadResponse.status === 401 || uploadResponse.status === 403) {
            console.error("Authentication required for file upload");
            return;
        }

        if (!uploadResponse.ok) {
            const error = await uploadResponse.json();
            showChatWarning(`Upload failed: ${error.error || 'Unknown error'}`);
            fileInput.value = '';
            return;
        }

        const result = await uploadResponse.json();

        if (result.status === 'success') {
            showChatWarning(`✓ File "${file.name}" uploaded successfully!`, true);
            fileInput.value = '';
            loadMessages(currentSelectedClient.id);
        } else {
            showChatWarning("Upload failed");
            fileInput.value = '';
        }
    } catch (error) {
        console.error('File upload error:', error);
        showChatWarning("Network error during upload");
        fileInput.value = '';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const fileUploadBtn = document.getElementById('fileUploadBtn');
    if (fileUploadBtn) {
        fileUploadBtn.addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });
    }

    const fileInput = document.getElementById('fileInput');
    if (fileInput) {
        fileInput.addEventListener('change', uploadFile);
    }
});

async function addClient() {
    const nameInput = document.getElementById("c_name");
    const emailInput = document.getElementById("c_email");
    const companyInput = document.getElementById("c_company");
    const phoneInput = document.getElementById("c_phone");
    const notesInput = document.getElementById("c_notes");

    if (!nameInput.value.trim()) {
        showWarning("Please enter a Client Name.");
        return;
    }

    const payload = {
        username: nameInput.value.trim(),
        email: emailInput.value.trim() || "N/A",
        company: companyInput.value.trim() || "N/A",
        phone: phoneInput.value.trim() || "N/A",
        notes: notesInput.value.trim() || "",
        role: "Client"
    };

    try {
        const response = await fetch("/api/clients/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        // Handle authentication errors
        if (response.status === 401 || response.status === 403) {
            console.error("Authentication required for adding client");
            return;
        }

        const result = await response.json();

        if (result.status === "success") {
            [nameInput, emailInput, companyInput, phoneInput, notesInput].forEach(i => i.value = "");
            await loadClients();
            showWarning(`Record for '${payload.username}' added successfully!`);
        } else {
            showWarning(`Error: ${result.error || "Unknown error"}`);
        }
    } catch (err) {
        console.error("Failed to add client:", err);
        showWarning("An error occurred while trying to save the record.");
    }
}

function showWarning(message) {
    if (/session|authentication required|unauthorized|forbidden|too many requests|429|log in again/i.test(String(message || ''))) {
        return;
    }

    const warningMessage = document.getElementById('warningMessage');
    const warningText = document.getElementById('warningText');
    warningText.textContent = message;
    warningMessage.style.display = 'block';
    
    setTimeout(() => {
        warningMessage.style.display = 'none';
    }, 5000);
}

function showChatWarning(message, isSuccess = false) {
    if (/session|authentication required|unauthorized|forbidden|too many requests|429|log in again/i.test(String(message || ''))) {
        return;
    }

    const warningMessage = document.getElementById('chatWarningMessage');
    const warningText = document.getElementById('chatWarningText');
    
    if (isSuccess) {
        warningMessage.style.background = "rgba(16, 185, 129, 0.1)";
        warningMessage.style.borderColor = "rgba(16, 185, 129, 0.3)";
        warningMessage.style.color = "#10b981";
    } else {
        warningMessage.style.background = "rgba(245, 158, 11, 0.1)";
        warningMessage.style.borderColor = "rgba(245, 158, 11, 0.3)";
        warningMessage.style.color = "#f59e0b";
    }
    
    warningText.textContent = message;
    warningMessage.style.display = 'block';
    
    setTimeout(() => {
        warningMessage.style.display = 'none';
    }, 5000);
}

window.onload = loadClients;
</script>

{% endblock %}
